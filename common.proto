syntax = "proto3";

package ap.static.common;

option csharp_namespace = "Static.Protos.Common";


message IdRequest {
    string id = 1;
}

message GetHealthStatusResponse {
    string status = 1;
}
message StatusResponse {
    bool success = 1;
    string message = 2;
}

message NamedEntityMessage
{
    string id = 1;
    string name = 2;
    string details = 3;
}

message PaginationRequest {
    int32 pageNumber =1;
    int32 pageSize = 2;
 }
 
 message PaginationResponse { 
   int32 totalItems = 1;
   int32 perPage = 2;
   int32 currentPage =3;
   int32 nextPage = 4;
   int32 previousPage = 5;
   int32 totalPages = 6;
 }