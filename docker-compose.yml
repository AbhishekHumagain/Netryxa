services:

  # ════════════════════════════════════════════════════════════
  # 1. Keycloak Postgres
  # ════════════════════════════════════════════════════════════
  keycloak-db:
    image: postgres:17-alpine
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════
  # 2. Keycloak — reads KEYCLOAK_CLIENT_SECRET / GOOGLE_* from .env
  #    Admin UI  →  http://localhost:8080  (admin / admin)
  #    Realm     →  http://localhost:8080/realms/static
  # ════════════════════════════════════════════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    command: start-dev --import-realm
    env_file: .env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_PORT: "8080"
    volumes:
      - ./keycloak/realm-static.json:/opt/keycloak/data/import/realm-static.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c",
             "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ════════════════════════════════════════════════════════════
  # 3. Static.API Postgres
  # ════════════════════════════════════════════════════════════
  static-api-db:
    image: postgres:17-alpine
    container_name: static-api-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: static
      POSTGRES_USER: static
      POSTGRES_PASSWORD: static
    volumes:
      - static_api_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U static -d static"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════
  # 4. PlantUML Server — renders UML text to SVG/PNG
  #    Internal only (no host port exposure needed)
  #    Health: http://plantuml-server:8080/
  # ════════════════════════════════════════════════════════════
  plantuml-server:
    image: plantuml/plantuml-server:jetty
    container_name: plantuml-server
    restart: unless-stopped
    environment:
      - PLANTUML_LIMIT_SIZE=8192
    ports:
      - "8081:8080"   # host:8081 → local dev; inside Docker use http://plantuml-server:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ════════════════════════════════════════════════════════════
  # 5. Static.API — all config comes from .env
  #    Swagger  →  http://localhost:5200/swagger
  # ════════════════════════════════════════════════════════════
  static-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: static-api
    restart: unless-stopped
    depends_on:
      static-api-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      plantuml-server:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside Docker, reach Keycloak via the service name, not localhost
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__Authority: http://localhost:8080/realms/static
      Keycloak__MetadataAddress: http://keycloak:8080/realms/static/.well-known/openid-configuration
      ConnectionStrings__DefaultConnection: Host=static-api-db;Port=5432;Database=static;Username=static;Password=static
      # PlantUML server — internal Docker network name
      PlantUml__BaseUrl: http://plantuml-server:8080
      # Listen on the same port that is published below (the shared .env says 8080)
      Kestrel__Endpoints__http__Url: http://0.0.0.0:5200
    ports:
      - "5200:5200"

volumes:
  keycloak_db_data:
  static_api_db_data:
